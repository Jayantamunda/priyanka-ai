<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Free AI Photo Generator</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', sans-serif;
    background: linear-gradient(135deg, #1e1e2f, #2a2a40);
    color: #fff;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
  }
  .container {
    background: rgba(255,255,255,0.05);
    backdrop-filter: blur(10px);
    border-radius: 20px;
    padding: 30px;
    max-width: 600px;
    width: 100%;
    box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    border: 1px solid rgba(255,255,255,0.1);
  }
  h1 {
    text-align: center;
    margin-bottom: 20px;
    font-size: 1.8rem;
    background: linear-gradient(90deg, #a78bfa, #f472b6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
  }
  .input-group {
    display: flex;
    gap: 10px;
    margin-bottom: 20px;
  }
  input[type="text"] {
    flex: 1;
    padding: 12px 16px;
    border-radius: 12px;
    border: 1px solid rgba(255,255,255,0.2);
    background: rgba(255,255,255,0.1);
    color: #fff;
    font-size: 1rem;
    outline: none;
  }
  input[type="text"]::placeholder {
    color: rgba(255,255,255,0.5);
  }
  button {
    padding: 12px 24px;
    border: none;
    border-radius: 12px;
    background: linear-gradient(90deg, #8b5cf6, #ec4899);
    color: #fff;
    font-weight: bold;
    cursor: pointer;
    font-size: 1rem;
    transition: transform 0.2s, opacity 0.2s;
  }
  button:hover {
    transform: scale(1.05);
    opacity: 0.9;
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .image-box {
    width: 100%;
    aspect-ratio: 1/1;
    border-radius: 16px;
    overflow: hidden;
    background: rgba(0,0,0,0.3);
    display: flex;
    justify-content: center;
    align-items: center;
    margin-bottom: 20px;
    border: 1px solid rgba(255,255,255,0.1);
  }
  .image-box img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: none;
  }
  .placeholder {
    color: rgba(255,255,255,0.4);
    font-size: 0.9rem;
  }
  .loader {
    border: 4px solid rgba(255,255,255,0.1);
    border-top: 4px solid #a78bfa;
    border-radius: 50%;
    width: 40px;
    height: 40px;
    animation: spin 1s linear infinite;
    display: none;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  .download-btn {
    display: none;
    width: 100%;
    margin-top: 10px;
    background: linear-gradient(90deg, #10b981, #059669);
  }
  .footer {
    text-align: center;
    margin-top: 20px;
    font-size: 0.8rem;
    color: rgba(255,255,255,0.4);
  }
</style>
</head>
<body>
<div class="container">
  <h1>🎨 Free AI Photo Generator</h1>
  <div class="input-group">
    <input type="text" id="prompt" placeholder="Kya banana hai? (e.g., cat in space)" />
    <button id="generateBtn" onclick="generateImage()">Generate</button>
  </div>
  <div class="image-box">
    <div class="placeholder" id="placeholder">Yahan image aayegi...</div>
    <div class="loader" id="loader"></div>
    <img id="resultImage" alt="Generated Image" />
  </div>
  <button class="download-btn" id="downloadBtn" onclick="downloadImage()">⬇ Download Image</button>
  <div class="footer">Powered by Pollinations.ai • Unlimited & Free</div>
</div>

<script>
  const promptInput = document.getElementById('prompt');
  const generateBtn = document.getElementById('generateBtn');
  const resultImage = document.getElementById('resultImage');
  const placeholder = document.getElementById('placeholder');
  const loader = document.getElementById('loader');
  const downloadBtn = document.getElementById('downloadBtn');

  function generateImage() {
    const prompt = promptInput.value.trim();
    if (!prompt) {
      alert('Kripya prompt likhein!');
      return;
    }

    generateBtn.disabled = true;
    generateBtn.textContent = 'Generating...';
    placeholder.style.display = 'none';
    resultImage.style.display = 'none';
    downloadBtn.style.display = 'none';
    loader.style.display = 'block';

    const seed = Math.floor(Math.random() * 1000000);
    const url = `https://image.pollinations.ai/prompt/${encodeURIComponent(prompt)}?width=512&height=512&seed=${seed}&nologo=true`;

    const img = new Image();
    img.crossOrigin = 'anonymous';
    img.onload = () => {
      resultImage.src = url;
      resultImage.style.display = 'block';
      loader.style.display = 'none';
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate';
      downloadBtn.style.display = 'block';
    };
    img.onerror = () => {
      alert('Image generate nahi ho payi. Dobara try karein.');
      loader.style.display = 'none';
      generateBtn.disabled = false;
      generateBtn.textContent = 'Generate';
      placeholder.style.display = 'block';
    };
    img.src = url;
  }

  function downloadImage() {
    const link = document.createElement('a');
    link.href = resultImage.src;
    link.download = 'ai-image.jpg';
    document.body.appendChild(link);
    link.click();
    document.body.removeChild(link);
  }

  promptInput.addEventListener('keypress', (e) => {
    if (e.key === 'Enter') generateImage();
  });
</script>
</body>
</html>
